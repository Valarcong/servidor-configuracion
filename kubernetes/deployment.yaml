apiVersion: apps/v1
kind: Deployment
metadata:
  name: servidor-configuracion-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: servidor-configuracion
  template:
    metadata:
      labels:
        app: servidor-configuracion
    spec:
      containers:
        - name: servidor-configuracion
          image: servidor-configuracion:1.0
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_URL
              value: http://servidor-discovery-service:8761/eureka/